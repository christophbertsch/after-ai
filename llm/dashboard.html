<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>After AI Dashboard</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f1117;
      color: #e3e3e3;
      margin: 2rem;
    }
    h1, h2 {
      color: #50fa7b;
    }
    .status, .vercel {
      background: #1a1d23;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    .buttons button {
      background: #444;
      color: #fff;
      border: none;
      padding: 0.8rem 1.2rem;
      margin: 0.4rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .buttons button:hover {
      background: #666;
    }
    code {
      font-size: 0.9rem;
      color: #8be9fd;
    }
    a { color: #8be9fd; text-decoration: none; }
  </style>
</head>
<body>
  <h1>After AI Dashboard</h1>

  <div class="status" id="status">
    <p><strong>Loading status...</strong></p>
  </div>

  <div class="vercel" id="vercel-logs">
    <h2>Vercel Deploy Info</h2>
    <p><em>Loading deployment info...</em></p>
  </div>

  <div class="buttons">
    <button onclick="trigger('/api/extract-products')">Extract Products</button>
    <button onclick="trigger('/api/optimize-seo')">Optimize First 10</button>
    <button onclick="trigger('/api/convert-to-oci')">Convert to OCI</button>
    <button onclick="trigger('/api/integrate-catalog')">Integrate Catalog</button>
  </div>

  <script>
    async function loadStatus() {
      const res = await fetch("/status");
      const json = await res.json();
      const el = document.getElementById("status");
      el.innerHTML = `
        <p><strong>LLM Server:</strong> ${json.llm_server}</p>
        <p><strong>Qdrant:</strong> ${json.qdrant}</p>
        <p><strong>Git Commit:</strong> <code>${json.git.commit}</code><br/>Date: ${json.git.date}</p>
        <p><strong>System:</strong> CPU ${json.system.cpu_percent}% / Memory ${json.system.memory_percent}%</p>
        <p><strong>Uptime:</strong> ${json.system.uptime}</p>
        <p><strong>Vercel:</strong> ${json.vercel}</p>
        <p><strong>Render:</strong> ${json.render}</p>
      `;
    }

    async function loadVercelLogs() {
      try {
        const res = await fetch("/logs/vercel");
        const data = await res.json();
        const logsEl = document.getElementById("vercel-logs");

        if (data.error) {
          logsEl.innerHTML += `<p><strong>Error:</strong> <code>${data.error}</code></p>`;
        } else {
          logsEl.innerHTML += `
            <p><strong>Status:</strong> ${data.status}</p>
            <p><strong>URL:</strong> <a href="https://${data.url}" target="_blank">${data.url}</a></p>
            <p><strong>Created:</strong> ${new Date(data.created).toLocaleString()}</p>
          `;
        }
      } catch (e) {
        document.getElementById("vercel-logs").innerHTML += `<p><em>Failed to fetch Vercel logs</em></p>`;
      }
    }

    async function trigger(endpoint) {
      alert(`Triggering: ${endpoint}`);
      try {
        const res = await fetch(endpoint, { method: "POST" });
        const json = await res.json();
        alert("Response: " + JSON.stringify(json));
      } catch (e) {
        alert("Error: " + e);
      }
    }
    loadStatus();
    loadVercelLogs();
  </script>
</body>
</html>
